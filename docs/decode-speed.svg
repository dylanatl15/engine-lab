<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="system-ui,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="640" height="340" fill="#ffffff"/>
<text x="24" y="34" font-size="18" font-weight="600" fill="#111">Decode speed, 76 GB MoE on one 16 GB Radeon VII</text>
<text x="24" y="54" font-size="12" fill="#555">Qwen3.8-Flash-Next IQ3_XXS, 200 tokens, greedy, scripts/bench.sh</text>
<line x1="170" y1="80" x2="170" y2="290" stroke="#bbb"/>
<text x="160" y="125" font-size="13" text-anchor="end" fill="#111">--n-cpu-moe only</text>
<text x="160" y="141" font-size="11" text-anchor="end" fill="#666">no expert cache</text>
<rect x="170" y="100" width="188" height="48" fill="#9aa3ad"/>
<text x="366" y="130" font-size="15" font-weight="600" fill="#111">10.5 t/s</text>
<text x="160" y="215" font-size="13" text-anchor="end" fill="#111">llama.cpp-lab</text>
<text x="160" y="231" font-size="11" text-anchor="end" fill="#666">cache + fused ops</text>
<rect x="170" y="190" width="440" height="48" fill="#d4472b"/>
<text x="500" y="220" font-size="15" font-weight="600" fill="#fff">26.8 t/s</text>
<text x="24" y="318" font-size="12" fill="#555">2.5x faster, output identical to the unmodified path. Measured 2026-10-21 on an HP Z640 (Xeon E5-2680 v4, 64 GB DDR4), PCIe 3.0 x16.</text>
</svg>
